<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Margin · 页边</title>
    <link rel="icon" href="/brand.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/review.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Margin 页边"><img src="/brand.svg" alt="" />Margin <small>页边</small></a>
      <span class="topbar-divider" aria-hidden="true"></span>
      <strong id="project-title"></strong>
      <button id="desktop-home" hidden>工作区</button>
      <span id="connection" role="status">正在连接…</span>
      <button id="theme" class="icon-button" aria-label="切换深浅主题" title="切换深浅主题"><svg class="icon" aria-hidden="true"><use href="/icons.svg#sun" /></svg></button>
      <button id="export-package" class="primary"><svg class="icon" aria-hidden="true"><use href="/icons.svg#export" /></svg>导出审阅包</button>
    </header>
    <div class="workspace">
      <aside class="navigation">
        <div class="navigation-body">
          <div class="section-label"><h2>工作区文档</h2><span id="document-total" class="count">0</span></div>
          <select id="document-select" aria-label="打开文档"></select>
          <div class="section-label outline-label"><h2>文档大纲</h2><span class="eyebrow">OUTLINE</span></div>
          <nav id="outline" aria-label="文档大纲"></nav>
          <div class="import-tools">
            <div class="section-label"><h2>添加到工作区</h2></div>
            <button id="import-files"><svg class="icon" aria-hidden="true"><use href="/icons.svg#file" /></svg>导入文档</button>
            <button id="import-folder"><svg class="icon" aria-hidden="true"><use href="/icons.svg#folder" /></svg>导入文件夹</button>
            <button id="import-package"><svg class="icon" aria-hidden="true"><use href="/icons.svg#import" /></svg>导入审阅包</button>
          </div>
        </div>
        <div class="navigation-footer"><span class="format-tag">MD</span><span class="format-tag">TEX</span><p class="hint">原始格式，完整记录。<br />每一次思考，都留在页边。</p></div>
      </aside>
      <main class="document-pane">
        <header class="document-toolbar">
           <div class="document-identity"><span class="eyebrow">READ & REVIEW</span><h1 id="document-title">正在打开…</h1><span id="document-info" class="muted"></span></div>
          <div class="view-switch" role="group" aria-label="文档视图">
            <button data-view="current" aria-pressed="true">正文</button>
            <button data-view="changes" aria-pressed="false">修订</button>
            <button data-view="original" aria-pressed="false">原稿</button>
          </div>
        </header>
        <div class="editing-toolbar">
          <button id="edit-source"><svg class="icon" aria-hidden="true"><use href="/icons.svg#edit" /></svg>编辑源码</button>
          <button id="document-comment"><svg class="icon" aria-hidden="true"><use href="/icons.svg#comment" /></svg>全文批注</button>
          <span class="toolbar-spacer"></span>
          <button id="checkpoint" title="以当前正文作为新一轮比较基线">新一轮审阅</button>
          <button id="export-document" title="导出当前文档的源码">导出正文</button>
        </div>
        <div id="external-notice" class="notice" hidden>文件或审阅记录已变化。<button id="reload">重新载入</button></div>
        <div id="encoding-notice" class="notice" hidden></div>
        <article id="document" class="paper" aria-label="文档正文"></article>
      </main>
      <aside class="review-pane" aria-label="审阅记录">
        <header class="inspector-heading"><div><span class="eyebrow">IN THE MARGIN</span><h2>审阅记录</h2></div><svg class="icon" aria-hidden="true"><use href="/icons.svg#comment" /></svg></header>
        <nav class="review-tabs" role="group" aria-label="记录类型">
          <button data-tab="comments" aria-pressed="true">批注 <span id="comment-count">0</span></button>
          <button data-tab="changes" aria-pressed="false">修订记录</button>
          <button data-tab="history" aria-pressed="false">全部历史</button>
        </nav>
        <label class="filter" id="comment-filter-label">显示 <select id="comment-filter"><option value="open">未解决</option><option value="all">全部（含已删除）</option><option value="resolved">已解决</option></select></label>
        <div id="review-list"></div>
      </aside>
    </div>
    <div id="selection-actions" class="selection-actions" role="toolbar" aria-label="选区操作" hidden>
      <button id="selection-comment">＋ 批注</button><button id="selection-replace">修订选区</button>
    </div>
    <dialog id="composer">
      <form id="composer-form">
        <header><h2 id="composer-title">添加批注</h2><button type="button" id="composer-close" aria-label="关闭">×</button></header>
        <blockquote id="composer-quote"></blockquote>
        <label id="body-label" for="composer-body">批注内容</label>
        <textarea id="composer-body" rows="8" required></textarea>
        <label id="reason-label" for="composer-reason" hidden>修改理由（可选）</label>
        <textarea id="composer-reason" rows="2" hidden></textarea>
        <label id="linked-label" for="composer-linked" hidden>关联批注</label>
        <select id="composer-linked" hidden><option value="">无</option></select>
        <p id="composer-error" role="alert"></p>
        <footer><button type="button" id="composer-cancel">取消</button><button type="submit" class="primary" id="composer-submit">保存批注</button></footer>
      </form>
    </dialog>
    <input id="files-input" type="file" multiple accept=".md,.tex,.bib,.sty,.cls,.png,.jpg,.jpeg,.gif,.webp,.svg,.pdf" hidden />
    <input id="folder-input" type="file" multiple webkitdirectory hidden />
    <input id="package-input" type="file" accept=".zip,.marginreview,.ppreview" hidden />
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script src="/vendor/katex/katex.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
