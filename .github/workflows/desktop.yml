name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to build and upload (leave empty for CI artifacts only)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --arm64
            artifact: mac-arm64
            executable: dist/mac-arm64/Margin.app/Contents/MacOS/Margin
          - os: macos-15-intel
            target: --mac --x64
            artifact: mac-x64
            executable: dist/mac/Margin.app/Contents/MacOS/Margin
          - os: windows-latest
            target: --win --x64
            artifact: windows-x64
            executable: dist/win-unpacked/Margin.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:markdown
      - run: npm run test:review-ui
      - run: npm run test:editor
      - run: npm run test:desktop
      - run: npm run desktop:dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged desktop
        run: npm run test:desktop
        env:
          MARGIN_DESKTOP_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v7
        with:
          name: margin-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  upload:
    if: inputs.release_tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: margin-*
          path: release-assets
          merge-multiple: true
      - name: Validate draft and generate checksums
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5
          sha256sum *.dmg *.zip *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload to draft release
        working-directory: release-assets
        run: gh release upload "$RELEASE_TAG" *.dmg *.zip *.exe SHA256SUMS.txt --clobber
